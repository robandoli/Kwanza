<nav class="site-nav" aria-label="Menu principal">
  <div class="container nav-container">

    <a
      href="{{ relLangURL "/" }}"
      class="nav-logo"
      data-analytics-event="navigation_click"
      data-analytics-param-navigation-area="header_logo"
      data-analytics-param-navigation-label="site_logo">
      {{ if in .RelPermalink "/vem-aprender" }}
        <img src="/img/logo-vem-aprender.webp" alt="Vem Aprender">
      {{ else }}
        <img src="/img/logo-kwanza.svg" alt="Identidade Kwanza">
      {{ end }}
    </a>

    <!-- Botão hamburger (mobile) -->
    <button class="nav-toggle"
            type="button"
            aria-label="{{ i18n "nav_toggle_label" }}"
            aria-expanded="false"
            aria-controls="primary-nav-menu"
            data-analytics-event="navigation_toggle"
            data-analytics-param-navigation-area="primary_menu"
            data-analytics-param-navigation-action="open">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-menu" id="primary-nav-menu">
      {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}"
             data-analytics-event="navigation_click"
             data-analytics-param-navigation-area="primary_menu"
             data-analytics-param-navigation-label="{{ .Identifier }}"
             {{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
               aria-current="page"
             {{ end }}>
            {{ .Name }}
          </a>
        </li>
      {{ end }}
    </ul>

    {{ partial "lang-switcher.html" . }}

  </div>
</nav>
